name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # Two Go modules live in this repo. Without both paths the module
          # cache is not restored and every run re-downloads from scratch.
          cache-dependency-path: |
            backend/go.sum
            browsers/isola-streamer/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      # The streamer's WebSocket suites encode through ffmpeg and fail rather
      # than skip when it is absent ("expected stream_init, got stream_reset"),
      # so ffmpeg must be on PATH before `go test`.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Streamer tests
        working-directory: browsers/isola-streamer
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test
