<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>isola — Remote Browser</title>
    <script>
      (function() {
        var stored = localStorage.getItem('isola_theme');
        if (stored === 'light') document.documentElement.classList.remove('dark');
      })();
    </script>
  </head>
  <body class="bg-zinc-100 dark:bg-gray-950 text-zinc-900 dark:text-white min-h-screen transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
